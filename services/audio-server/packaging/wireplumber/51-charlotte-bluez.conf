# Charlotte audio-server — WirePlumber (0.5+) configuration.
# Install: ~/.config/wireplumber/wireplumber.conf.d/51-charlotte-bluez.conf
# Then:    systemctl --user restart wireplumber   (and reconnect the devices)

# 1. Behave as a music speaker only (A2DP). Without this, Debian also offers the
#    hands-free / headset roles (HFP/HSP): a Mac or iPhone may then pick the
#    "phone call" profile (mSBC, 16 kHz mono) and the sound becomes choppy.
#    a2dp_sink   = phones/computers stream music TO us
#    a2dp_source = we stream the mix to Bluetooth headphones/speakers
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
  bluez5.hfphsp-backend = "none"
  # Higher-bitrate SBC ("SBC-XQ") towards headphones/speakers that accept it.
  # Devices that refuse it fall back to standard SBC automatically.
  bluez5.enable-sbc-xq = true
}

# 2. Never switch a headset to the call profile automatically.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

# 3. By default PipeWire plays audio received from a phone straight to the
#    speakers (bluez5.media-source-role = "playback"). With "input", each phone
#    appears as an Audio/Source node that the Charlotte mixer captures instead.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = "input"
      }
    }
  }
]
