# Charlotte audio-server — default configuration.
# Copy to /etc/charlotte/audio-server.toml (system) or pass with --config.

[server]
name = "charlotte-audio-server"
# Local HTTP API used by the Charlotte gateway. It has NO authentication:
# keep host = 127.0.0.1 (the gateway, which has login, is the public entry).
api_enabled = true
host = "127.0.0.1"
port = 8080

[audio]
# Internal mixing format. Milestone 1 supports only 48000 Hz / stereo / f32.
# PipeWire converts every input to this format before it reaches the mixer.
sample_rate = 48000
channels = 2
format = "f32"
# PipeWire quantum requested by our streams, in frames (power of two, 64..=8192).
buffer_size = 512
# Audio buffered per input before it is mixed. Absorbs Bluetooth jitter (ms).
input_latency_ms = 60
# Max number of simultaneous inputs.
max_inputs = 16
master_volume = 0.8
limiter_enabled = true
# Limiter ceiling (linear, 0 < x <= 1).
limiter_threshold = 0.95

[bluetooth]
enabled = true
# Name shown on phones / Macs when they look for Bluetooth devices.
name = "Charlotte"
adapter = "hci0"
auto_accept_trusted_devices = true
# Automatically add every new Bluetooth audio source to the mixer.
auto_connect_sources = true

[output]
# "default" = PipeWire default sink (changeable from the GUI), or a fixed node.name
# (see `audio-server list-nodes`).
device = "default"
# With device = "default": any Bluetooth headphones/speaker that connects becomes the output.
follow_bluetooth = true

[ducking]
# Smart mixing: when a device starts playing, the others are lowered so it can
# be heard, then restored when it stops.
enabled = true
level_db = -18.0       # level of the other devices meanwhile
threshold_db = -50.0   # "playing" = louder than this
hold_ms = 2000         # silence before a device gives the foreground back
attack_ms = 300        # fade down
release_ms = 1500      # fade back up

[logging]
level = "info"
